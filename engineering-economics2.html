  { q: "114. It is the profit obtained by selling stocks at a higher price than its original purchase price", options: ["A. Debenture", "B. Goodwill", "C. Capital Gain", "D. Internal rate of return"], answer: 2 },
  { q: "115. The quantity of a certain commodity that is offered for sale at a certain price at a given time and place", options: ["A. Demand", "B. Supply", "C. Utility", "D. Market"], answer: 1 },
  { q: "116. The quantity of a certain commodity that is bought at a certain price at a given time and place", options: ["A. Demand", "B. Supply", "C. Market", "D. Utility"], answer: 0 },
  { q: "117. “When free competition exists, the price of a product will be that value where supply is equal to the demand”", options: ["A. Law of diminishing return", "B. Law of Supply", "C. Law of Demand", "D. Law of Supply and Demand"], answer: 3 },
  { q: "118. “When one of the factors or production is fixed in quantity or is difficult to increase, increasing the other factors of production will result in a less than proportionate increase in output”", options: ["A. Law of diminishing return", "B. Law of supply", "C. Law of Demand", "D. Law of supply and demand"], answer: 0 },
  { q: "119. GATT stands for", options: ["A. General Agreement of Tariff and Trade", "B. General Arrangement of Tariff and Trade", "C. Global Agreement of Tariff and Trade", "D. Global Arrangement of Tariff and Trade"], answer: 0 },
  { q: "120. The letter D in the Roman Numerals is", options: ["A. 50", "B. 100", "C. 500", "D. 1000"], answer: 2 }
];

let userAnswers = new Array(quizData.length).fill(null);

function renderQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  
  quizData.forEach((qData, qIndex) => {
    const section = document.createElement('section');
    section.className = 'question';
    
    const h2 = document.createElement('h2');
    h2.textContent = qData.q;
    section.appendChild(h2);
    
    const ul = document.createElement('ol');
    ul.className = 'options';
    
    qData.options.forEach((optionText, oIndex) => {
      const li = document.createElement('li');
      li.textContent = optionText;
      
      if (userAnswers[qIndex] !== null) {
        if (oIndex === qData.answer) {
          li.classList.add('correct');
        } else if (userAnswers[qIndex] === oIndex) {
          li.classList.add('incorrect');
        }
      } else {
        li.onclick = () => selectOption(qIndex, oIndex);
      }
      
      ul.appendChild(li);
    });
    
    section.appendChild(ul);
    container.appendChild(section);
  });
  
  updateScore();
}

function selectOption(qIndex, oIndex) {
  if (userAnswers[qIndex] !== null) return;
  userAnswers[qIndex] = oIndex;
  renderQuiz();
}

function updateScore() {
  let score = 0;
  userAnswers.forEach((ans, idx) => {
    if (ans === quizData[idx].answer) {
      score++;
    }
  });
  document.getElementById('score-text').textContent = `Score: ${score} / ${quizData.length}`;
}

function resetQuiz() {
  userAnswers = new Array(quizData.length).fill(null);
  renderQuiz();
}

renderQuiz();
</script>
