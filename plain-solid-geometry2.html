            font-size: 0.9rem;

        }

            font-weight: 600;
            margin: 0 0 1rem 0;
            color: var(--text-main);
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .option-btn {
            width: 100%;
            text-align: left;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .option-btn:disabled { cursor: default; }

        .option-btn.correct {
            background-color: var(--correct-bg);
            border-color: var(--correct-border);
            color: var(--correct-text);
            font-weight: 600;
        }

        .option-btn.incorrect {
            background-color: var(--incorrect-bg);
            border-color: var(--incorrect-border);
            color: var(--incorrect-text);
        }

        .category-tag {
            display: inline-block;
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            background: #e2e8f0;
            color: #475569;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

            color: white;
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 1.5rem;
            display: flex;

            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;

        .btn:hover { background: var(--primary-hover); }

        .no-results {

            padding: 2rem;
            color: var(--text-muted);
        }
         .back,

            text-decoration: none;
        }

</head>

let state = {
    answers: {},
    filteredQuestions: []
};

function resetQuiz() {
    if (confirm("Are you sure you want to reset all your progress in Geometry?")) {
        state.answers = {};
        updateStats();
        renderQuestions();
    }
}

function updateStats() {
    const totalAnswered = Object.keys(state.answers).length;
    let totalCorrect = 0;

    Object.keys(state.answers).forEach(id => {
        const item = rawData.find(q => q.id === id);
        if (item && state.answers[id] === item.answer) {
            totalCorrect++;
        }
    });

    document.getElementById('score-answered').innerText = totalAnswered;
    document.getElementById('score-correct').innerText = totalCorrect;
    const accuracy = totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 0;
    document.getElementById('score-accuracy').innerText = `${accuracy}%`;
    document.getElementById('total-count').innerText = rawData.length;
}

function handleOptionClick(questionId, optionIdx) {
    if (state.answers[questionId] !== undefined) return;
    
    state.answers[questionId] = optionIdx;
    updateStats();
    
    const qCard = document.getElementById(`card-${questionId}`);
    if (qCard) {
        const item = rawData.find(q => q.id === questionId);
        qCard.outerHTML = renderQuestionCard(item);
    }
}

function renderQuestionCard(item) {
    const userAnswer = state.answers[item.id];
    const isAnswered = userAnswer !== undefined;
    const labels = ['A', 'B', 'C', 'D'];

    const optionsHtml = item.options.map((opt, idx) => {
        let btnClass = "option-btn";
        if (isAnswered) {
            if (idx === item.answer) {
                btnClass += " correct";
            } else if (idx === userAnswer) {
                btnClass += " incorrect";
            }
        }

        return `
            <li>
                <button 
                    class="${btnClass}" 
                    onclick="handleOptionClick('${item.id}', ${idx})"
                    ${isAnswered ? 'disabled' : ''}>
                    <strong>${labels[idx]}.</strong>&nbsp; ${opt}
                </button>
            </li>
        `;
    }).join('');

    return `
        <div class="question-card" id="card-${item.id}">
            <span class="category-tag">${item.category}</span>
            <h2 class="question-title">${item.q}</h2>
            <ul class="options-list">
                ${optionsHtml}
            </ul>
        </div>
    `;
}

function filterQuestions() {
    const search = document.getElementById('search-input').value.toLowerCase();
    state.filteredQuestions = rawData.filter(item => {
        return item.q.toLowerCase().includes(search) || 
               item.options.some(opt => opt.toLowerCase().includes(search));
    });
    renderQuestions();
}

function renderQuestions() {
    const container = document.getElementById('quiz-container');
    if (state.filteredQuestions.length === 0) {
        container.innerHTML = `<div class="no-results">No questions match your search.</div>`;
        return;
    }
    container.innerHTML = state.filteredQuestions.map(renderQuestionCard).join('');
}

state.filteredQuestions = [...rawData];
renderQuestions();
updateStats();
</script>
